# configs/ablation_ln_stageA_classonly_20ep_A100_bs4_acc8.yaml

trainer:
  max_epochs: 20

  # --- GPU (A100) setup ---
  accelerator: "gpu"
  devices: 1
  strategy: "auto"
  precision: "16-mixed"

  # Effective batch = 4 * 8 = 32
  accumulate_grad_batches: 8

  gradient_clip_val: 1.0
  gradient_clip_algorithm: "norm"

  log_every_n_steps: 20
  check_val_every_n_epoch: 1
  enable_model_summary: False

  # Full validation for the real run
  limit_val_batches: 1.0

  logger:
    class_path: lightning.pytorch.loggers.wandb.WandbLogger
    init_args:
      resume: allow
      project: "eomt"
      name: "cs_eomt_ln_stageA_classonly_A100_bs4_acc8_10ep_lr0005"

  callbacks:
    - class_path: training.live_plot_callback.LivePlotCallback
    - class_path: training.simple_progress_callback.SimpleProgressCallback

model:
  class_path: training.mask_classification_semantic.MaskClassificationSemantic
  init_args:
    # Image and class config
    img_size: [1024, 1024]
    num_classes: 19

    # Attention mask annealing
    # Scaled for ~14880 total steps (batch 4 -> ~744 steps/epoch; *20 -> ~14880)
    attn_mask_annealing_enabled: True
    attn_mask_annealing_start_steps: [0, 4960, 9920]
    attn_mask_annealing_end_steps: [4960, 9920, 14880]

    # LogitNorm settings
    use_logit_norm: True
    logit_norm_temp: 0.3

    # Stage control
    finetune_stage: "A_class_only"
    train_heads_in_stage_b: True
    train_heads_in_stage_c: True

    # Checkpoint loading
    ckpt_path: "/content/drive/MyDrive/eomt_cityscapes.bin"
    delta_weights: False
    load_ckpt_class_head: False

    # Optimizer control
    lr: 0.0005
    weight_decay: 0.01

    llrd: 1.0
    llrd_l2_enabled: False

    lr_mult: 1.0
    poly_power: 0.9

    # Warmup scaled for the longer run; keep list type
    # Roughly ~2% and ~4% of total steps
    warmup_steps: [300, 600]

    # Loss coefficients
    mask_coefficient: 5.0
    dice_coefficient: 5.0
    class_coefficient: 2.0
    no_object_coefficient: 0.1
    mask_thresh: 0.8
    overlap_thresh: 0.8

    # Sampling for loss
    num_points: 12544
    oversample_ratio: 3.0
    importance_sample_ratio: 0.75

    # Semantic specific
    ignore_idx: 255

    # LoRA config (disabled for Stage A)
    lora:
      enabled: False
      rank: 4
      alpha: 16
      dropout: 0.0
      target_modules: ["q_proj", "v_proj"]
      last_n_blocks: 2

    # Network architecture
    network:
      class_path: models.eomt.EoMT
      init_args:
        num_q: 100
        num_blocks: 3
        encoder:
          class_path: models.vit.ViT
          init_args:
            backbone_name: vit_base_patch14_reg4_dinov2

data:
  class_path: datasets.cityscapes_semantic.CityscapesSemantic
  init_args:
    batch_size: 8
    num_workers: 8
