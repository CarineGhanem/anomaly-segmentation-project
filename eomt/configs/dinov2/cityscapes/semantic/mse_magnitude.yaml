# ===============================================================
# ABLATION 2: LogitNorm (CE-only) + Magnitude Loss
# Tests: Does combining calibration with magnitude regularization
#        give the best of both worlds?
# ===============================================================
# Hypothesis: LogitNorm reduces overconfidence on known classes,
# while magnitude loss preserves OOD discrimination signal

trainer:
  max_epochs: 20
  precision: "16-mixed"
  accumulate_grad_batches: 8
  gradient_clip_val: 0.01
  gradient_clip_algorithm: "norm"
  log_every_n_steps: 50
  check_val_every_n_epoch: 1
  enable_model_summary: False
  devices: 1

  logger:
    class_path: lightning.pytorch.loggers.wandb.WandbLogger
    init_args:
      resume: allow
      project: "eomt"
      name: "cs_eomt_ablation2_logitnorm_ce_magnitude"

  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        dirpath: "outputs/ablation2_logitnorm_ce_magnitude"
        filename: "best-{epoch:02d}-{metrics/val_iou_all:.4f}"
        monitor: "metrics/val_iou_all"
        mode: "max"
        save_top_k: 1
        save_last: True
        verbose: True

model:
  class_path: training.mask_classification_semantic.MaskClassificationSemantic
  init_args:
    img_size: [1024, 1024]
    num_classes: 19

    attn_mask_annealing_enabled: True
    attn_mask_annealing_start_steps: [3317, 8292, 13268]
    attn_mask_annealing_end_steps: [6634, 11609, 16585]

    # LogitNorm: CE-only mode
    use_logit_norm: True
    logit_norm_temp: 0.5
    logit_norm_mode: "ce" # CRITICAL: Only apply to CE loss, not matching

    # Magnitude-aware calibration: ENABLED
    use_magnitude_loss: True
    magnitude_loss_type: "mse"
    magnitude_coefficient: 0.5 # Moderate weight alongside LogitNorm
    magnitude_threshold: 1.0

    # Stage control
    finetune_stage: "A_class_only"
    train_heads_in_stage_b: True
    train_heads_in_stage_c: True

    # Checkpoint loading
    ckpt_path: "/content/drive/MyDrive/eomt_cityscapes.bin"
    delta_weights: False
    load_ckpt_class_head: False

    # Optimizer
    lr: 0.0005
    weight_decay: 0.01
    llrd: 0.8
    llrd_l2_enabled: True
    lr_mult: 1.0
    poly_power: 0.9
    warmup_steps: [100, 200]

    # Loss coefficients
    mask_coefficient: 5.0
    dice_coefficient: 5.0
    class_coefficient: 2.0
    no_object_coefficient: 0.1
    mask_thresh: 0.8
    overlap_thresh: 0.8

    num_points: 12544
    oversample_ratio: 3.0
    importance_sample_ratio: 0.75
    ignore_idx: 255

    lora:
      enabled: False

    network:
      class_path: models.eomt.EoMT
      init_args:
        num_q: 100
        num_blocks: 3
        encoder:
          class_path: models.vit.ViT
          init_args:
            backbone_name: vit_base_patch14_reg4_dinov2

data:
  class_path: datasets.cityscapes_semantic.CityscapesSemantic
