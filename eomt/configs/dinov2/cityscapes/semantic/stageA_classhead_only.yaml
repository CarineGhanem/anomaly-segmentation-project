# configs/ablation_ln_stageA_classonly.yaml

trainer:
  max_epochs: 20

  # --- TPU optimization ---
  accelerator: "tpu"
  devices: 8
  strategy: "xla"
  precision: "bf16-mixed"

  # Effective batch sizing:
  # per-device batch (2) * devices (8) = global 16
  # global 16 * accumulate (4) = effective 64
  accumulate_grad_batches: 4

  # Clip was far too small; 1.0 is a common safe default
  gradient_clip_val: 1.0
  gradient_clip_algorithm: "norm"

  log_every_n_steps: 20
  check_val_every_n_epoch: 1
  enable_model_summary: False

  logger:
    class_path: lightning.pytorch.loggers.wandb.WandbLogger
    init_args:
      resume: allow
      project: "eomt"
      name: "cs_eomt_ln_stageA_classonly"

model:
  class_path: training.mask_classification_semantic.MaskClassificationSemantic
  init_args:
    # Image and class config
    img_size: [1024, 1024]
    num_classes: 19

    # Attention mask annealing
    # Adjusted for ~3720 total steps (Cityscapes 2975 / global batch 16 ≈ 186 steps/epoch; * 20 ≈ 3720)
    attn_mask_annealing_enabled: True
    attn_mask_annealing_start_steps: [0, 1240, 2480]
    attn_mask_annealing_end_steps: [1240, 2480, 3720]

    # LogitNorm settings
    use_logit_norm: True
    logit_norm_temp: 0.5 # Your current best

    # Stage control
    finetune_stage: "A_class_only" # NEW: Only class head
    train_heads_in_stage_b: True
    train_heads_in_stage_c: True

    # Checkpoint loading
    ckpt_path: "/content/drive/MyDrive/eomt_cityscapes.bin"
    delta_weights: False
    load_ckpt_class_head: False # Re-initialize class head only

    # Optimizer control
    lr: 0.001 # (0.003 could be tried later, but start here)
    weight_decay: 0.01

    # LLRD isn't useful for true class-only; keep neutral + disable extra L2 logic
    llrd: 1.0
    llrd_l2_enabled: False

    lr_mult: 1.0
    poly_power: 0.9

    # Warmup: use a single value (scaled to total steps)
    warmup_steps: 180

    # Loss coefficients
    mask_coefficient: 5.0
    dice_coefficient: 5.0
    class_coefficient: 2.0
    no_object_coefficient: 0.1
    mask_thresh: 0.8
    overlap_thresh: 0.8

    # Sampling for loss
    num_points: 12544
    oversample_ratio: 3.0
    importance_sample_ratio: 0.75

    # Semantic specific
    ignore_idx: 255

    # LoRA config (disabled for Stage A)
    lora:
      enabled: False
      rank: 4
      alpha: 16
      dropout: 0.0
      target_modules: ["q_proj", "v_proj"]
      last_n_blocks: 2

    # Network architecture
    network:
      class_path: models.eomt.EoMT
      init_args:
        num_q: 100
        num_blocks: 3
        encoder:
          class_path: models.vit.ViT
          init_args:
            backbone_name: vit_base_patch14_reg4_dinov2

data:
  class_path: datasets.cityscapes_semantic.CityscapesSemantic
  init_args:
    # TPU: batch_size is PER DEVICE; keep small to avoid OOM and keep effective batch stable
    batch_size: 2
    num_workers: 8
